[package]
name = "pdfe"
version = "0.1.0"
description = "PDFe - 现代化 Windows PDF 编辑器"
authors = ["konny_yuan"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to only be an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pdfe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdfium-render = { version = "0.8", features = ["thread_safe"] }
image = "0.25"
thiserror = "2"
tauri-plugin-dialog = "2.7.3"

# 可选 feature：启用后引入 Tesseract OCR 引擎。
# 注意：构建时需要 cmake + 系统已安装 libtesseract-dev / tesseract-ocr-devel。
# 默认关闭，普通用户 cargo build 不受影响。
tesseract = { version = "0.15", optional = true }

[features]
# 默认无 OCR。启用方法：cargo build --features ocr
default = []
ocr = ["dep:tesseract"]


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
