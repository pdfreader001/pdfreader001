[package]
name = "pdfe"
version = "0.1.0"
description = "PDFe - 现代化 Windows PDF 编辑器"
authors = ["konny_yuan"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to only be an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pdfe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdfium-render = { version = "0.8", features = ["thread_safe"] }
image = "0.25"
thiserror = "2"
tauri-plugin-dialog = "2.7.3"

# P4：pdfium-render 只能读取加密状态、不能写入加密（save_to_writer 里硬编码 flags = 0）。
# 因此加密导出走：pdfium save_to_bytes（明文）→ lopdf 载入 → EncryptionState → 重序列化。
lopdf = "0.45"

# 可选 feature：启用后引入 Tesseract OCR 引擎。
# 注意：构建时需要 cmake + 系统已安装 libtesseract-dev / tesseract-ocr-devel。
# 默认关闭，普通用户 cargo build 不受影响。
tesseract = { version = "0.15", optional = true }

[features]
# 默认无 OCR。启用方法：cargo build --features ocr
default = []
ocr = ["dep:tesseract"]

[dev-dependencies]
# 用于生成带 AcroForm 字段的测试 PDF fixture（和 perf.rs 自动生成 large_*.pdf 同模式）
printpdf = { version = "0.7", default-features = false, features = ["embedded_images"] }

# 命令层集成测试（tests/commands.rs）需要 tauri::test（mock 运行时）。
# 该模块被 #[cfg(any(test, feature = "test"))] 门控，外部 crate 的集成测试必须显式开启 test feature。
tauri = { version = "2", features = ["test"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
